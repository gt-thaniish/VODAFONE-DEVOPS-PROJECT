name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies and test
        run: |
          pip install -r flask-app/requirements.txt
          python3 -m unittest discover flask-app/tests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Docker build & push
        run: |
          # Build the Docker image from the flask-app directory
          docker build -t flask-app:latest ./flask-app

          # Tag the image with the full ECR repo URL
          docker tag flask-app:latest ${{ secrets.ECR_URL }}:latest

          # Login to ECR (only use the base URL without /flask-app)
          aws ecr get-login-password | docker login --username AWS --password-stdin ${{ secrets.ECR_URL_BASE }}

          # Push the image to ECR
          docker push ${{ secrets.ECR_URL }}:latest


      - name: Commit and Push Helm chart changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          git fetch origin
          git pull origin main --rebase

          git add helm-charts/flask-app/values.yaml
          git diff --cached --quiet || git commit -m "Update image tag"
          git push origin HEAD:main
