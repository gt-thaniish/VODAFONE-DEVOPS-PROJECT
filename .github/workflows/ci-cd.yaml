name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies and test
        run: |
          pip install -r flask-app/requirements.txt
          python3 -m unittest discover flask-app/tests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Docker build & push
        run: |
          docker build -t flask-app:latest ./flask-app
          docker tag flask-app:latest 253284761052.dkr.ecr.us-east-1.amazonaws.com/flask-app:latest
          aws ecr get-login-password | docker login --username AWS --password-stdin ${{ secrets.ECR_URL }}/flask-app
          docker push ${{ secrets.ECR_URL }}/flask-app

      - name: Update Helm and Push
        run: |
          sed -i "s/tag: .*/tag: latest/" helm-charts/flask-app/values.yaml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git diff --quiet || git commit -am "Update image tag"
          git push
